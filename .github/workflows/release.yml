name: Release

# Creates the git tag v<package.json version> and a GitHub release on the chosen commit, then runs
# the "Docker image" workflow on that tag, which publishes :<version>, :<major>.<minor> and :latest.
# Run it from Actions > Release > Run workflow (branch: main). It does nothing if the release exists.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - name: Create tag and release
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do"
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "kan-mcp-full ${TAG#v}" --generate-notes
          # Events created with GITHUB_TOKEN do not start other workflows, so run the image build explicitly.
          gh workflow run docker.yml --ref "$TAG"
