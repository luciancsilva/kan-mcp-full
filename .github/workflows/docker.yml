name: Docker image

# Publishes ghcr.io/<owner>/kan-mcp-full:
#   - every push to main      -> ":latest" and ":sha-<short>"
#   - a v*.*.* tag            -> ":latest", ":<version>" and ":<major>.<minor>" (e.g. 0.4.0 and 0.4)
#   - manual run              -> same as a push to the chosen branch
# Pull requests only build the image (no push) to catch Dockerfile errors.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'package.json', 'bun.lock', 'src/**', '.github/workflows/docker.yml']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/kan-mcp-full

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Pulls what was just published and runs it, so a broken image is caught right away.
  smoke:
    if: github.event_name != 'pull_request'
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the published image and check it
        run: |
          IMG="${IMAGE}:sha-${GITHUB_SHA::7}"
          docker pull "$IMG"
          docker run -d --name smoke -p 3333:3333 \
            -e KAN_API_KEY=smoke -e KAN_API_BASE_URL=http://127.0.0.1:1/api/v1 \
            -e MCP_AUTH_TOKEN=smoke-token-smoke-token "$IMG"
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3333/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:3333/health
          echo
          COUNT=$(curl -fsS -X POST http://127.0.0.1:3333/mcp \
            -H 'authorization: Bearer smoke-token-smoke-token' \
            -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | jq '.result.tools | length')
          echo "tools: $COUNT"
          test "$COUNT" = "54"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3333/mcp -d '{}')" = "401"
          docker logs smoke
          docker rm -f smoke
