name: Delete merged branches

# Deletes the head branch of a pull request once it is merged (the same as GitHub's "Automatically
# delete head branches" setting), and can delete one branch on demand (Actions > Delete merged
# branches > Run workflow). It never touches the default branch or branches of forks.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to delete (not the default branch)
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.pull_request.head.ref }}
    steps:
      - name: Delete the branch
        run: |
          if [ -z "$BRANCH" ] || [ "$BRANCH" = "$DEFAULT_BRANCH" ] || [ "$BRANCH" = "main" ]; then
            echo "Refusing to delete '$BRANCH'"; exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
            echo "Deleted branch ${BRANCH}"
          else
            echo "Branch ${BRANCH} does not exist, nothing to do"
          fi
